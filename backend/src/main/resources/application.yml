# 운영 기본값. 모든 값은 환경변수로 넣는다 (backend/README.md 참고).
spring:
  application:
    name: tukfit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tukfit}
    username: ${DB_USERNAME:tukfit}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  # Nginx가 넘겨주는 X-Forwarded-* 헤더로 https 주소와 Secure 쿠키를 판단한다.
  forward-headers-strategy: native
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  health:
    # 메일 서버는 선택 사항이라 서버 상태 판단에서 뺀다.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/docs/openapi.json
  swagger-ui:
    path: /api/v1/docs

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: error

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  docs-public: ${DOCS_PUBLIC:false}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
  cookie:
    secure: ${COOKIE_SECURE:true}
    domain: ${COOKIE_DOMAIN:}
  storage:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:auto}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    path-style: ${S3_PATH_STYLE:true}
  payment:
    provider: ${PAYMENT_PROVIDER:MOCK}
    toss:
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:no-reply@tukfit.local}

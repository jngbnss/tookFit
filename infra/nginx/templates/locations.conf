# 공통 라우팅: API와 소셜 로그인은 Spring, 나머지는 Next.js

location /api/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/conf.d/proxy-headers.inc;
}

location /oauth2/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/conf.d/proxy-headers.inc;
}

location /login/oauth2/ {
    proxy_pass http://backend:8080;
    include /etc/nginx/conf.d/proxy-headers.inc;
}

# actuator는 외부에 노출하지 않는다 (컨테이너 헬스체크는 내부에서 직접 호출)
location /actuator/ {
    return 404;
}

location /_next/static/ {
    proxy_pass http://frontend:3000;
    include /etc/nginx/conf.d/proxy-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://frontend:3000;
    include /etc/nginx/conf.d/proxy-headers.inc;
}
